name: CI

on:
  pull_request:
    branches:
      - main
  workflow_call:

permissions:
  contents: read

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
        with:
          version: "0.11.2"
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - name: Install locked dependencies
        run: uv sync --locked
      - name: Run backend tests
        run: uv run --frozen pytest

  frontend:
    name: Frontend checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install locked dependencies
        run: npm ci
      - name: Run frontend tests
        run: node --experimental-strip-types --test tests/*.test.mjs
      - name: Typecheck application and Vite configuration
        run: |
          npx vue-tsc --noEmit -p tsconfig.app.json
          npx vue-tsc --noEmit -p tsconfig.node.json
      - name: Build frontend
        run: npm run build

  release-checks:
    name: Release checks
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Validate version consistency
        run: python3 scripts/version.py check
      - name: Validate release tag on main
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python3 scripts/version.py check "$RELEASE_TAG"
          git merge-base --is-ancestor HEAD origin/main
      - name: Check deployment script syntax
        run: bash -n scripts/deploy-production.sh
      - name: Run deployment script tests
        run: python3 -m unittest discover -s scripts/tests -v
