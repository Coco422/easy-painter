name: Container images

on:
  push:
    branches:
      - main
    tags:
      - "v*.*.*"
    paths:
      - ".github/workflows/container-images.yml"
      - "VERSION"
      - "CHANGELOG.md"
      - "backend/**"
      - "frontend/**"
      - "deploy/nginx/**"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: container-images-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: coco422/easy-painter

jobs:
  build:
    name: Build ${{ matrix.image }} image
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: backend
            dockerfile: backend/Dockerfile
          - image: nginx
            dockerfile: deploy/nginx/Dockerfile
          - image: migrations
            dockerfile: backend/db/Dockerfile

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate image metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-${{ matrix.image }}
          tags: |
            type=raw,value=main,enable=${{ github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
            type=sha,prefix=sha-,format=long
            type=ref,event=tag
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}

      - name: Build and push image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
          provenance: mode=max
          sbom: true

  deploy:
    name: Deploy production release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    environment: production
    concurrency:
      group: easy-painter-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Validate release on main
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          python3 scripts/version.py check "$RELEASE_TAG"
          git merge-base --is-ancestor HEAD origin/main
          bash -n scripts/deploy-production.sh
          python3 -m unittest discover -s scripts/tests -v
      - name: Deploy over SSH
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          : "${DEPLOY_HOST:?}" "${DEPLOY_USER:?}" "${DEPLOY_PATH:?}" "${DEPLOY_SSH_KEY:?}" "${DEPLOY_KNOWN_HOSTS:?}"
          install -d -m 700 ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/deploy_key ~/.ssh/known_hosts
          ssh_args=(-i ~/.ssh/deploy_key -p "${DEPLOY_PORT:-22}" -o BatchMode=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=20 -o ServerAliveInterval=15 -o ServerAliveCountMax=3)
          target="$DEPLOY_USER@$DEPLOY_HOST"
          remote_bundle=$(ssh "${ssh_args[@]}" "$target" 'mktemp -d /tmp/easy-painter-cd.XXXXXXXX')
          [[ "$remote_bundle" =~ ^/tmp/easy-painter-cd\.[a-zA-Z0-9]+$ ]]
          trap 'ssh "${ssh_args[@]}" "$target" "rm -rf -- $remote_bundle"; rm -f ~/.ssh/deploy_key' EXIT
          tar -czf - scripts/deploy-production.sh deploy/compose.yml | ssh "${ssh_args[@]}" "$target" "tar -xzf - -C $remote_bundle"
          printf -v remote_command 'bash %q %q %q' "$remote_bundle/scripts/deploy-production.sh" "$RELEASE_TAG" "$DEPLOY_PATH"
          ssh "${ssh_args[@]}" "$target" "$remote_command"
