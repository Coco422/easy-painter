name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  release:
    name: Create GitHub release
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Build release notes
        id: notes
        shell: bash
        run: |
          set -euo pipefail

          tag="${GITHUB_REF_NAME}"
          previous_tag="$(git tag --sort=-v:refname | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | grep -v "^${tag}$" | head -n 1 || true)"

          if [[ -n "${previous_tag}" ]]; then
            range="${previous_tag}..${tag}"
            title="${tag} changes since ${previous_tag}"
          else
            range="${tag}"
            title="${tag} changes"
          fi

          notes_file="${RUNNER_TEMP}/release-notes.md"
          {
            echo "## ${title}"
            echo
            git log --format='- %s (%h)' --extended-regexp --grep='^feat(\([^)]*\))?:' "${range}" || true
          } > "${notes_file}"

          if [[ "$(wc -l < "${notes_file}")" -le 2 ]]; then
            {
              echo "## ${title}"
              echo
              echo "No feat commits found between these tags."
            } > "${notes_file}"
          fi

          echo "path=${notes_file}" >> "${GITHUB_OUTPUT}"

      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            --title "${GITHUB_REF_NAME}" \
            --notes-file "${{ steps.notes.outputs.path }}"
