name: Release

on:
  workflow_call:

permissions:
  contents: write

jobs:
  release:
    name: Create GitHub release
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Validate release version
        run: python3 scripts/version.py check "${GITHUB_REF_NAME}"

      - name: Build release notes
        id: notes
        shell: bash
        run: |
          set -euo pipefail

          notes_file="${RUNNER_TEMP}/release-notes.md"
          python3 scripts/version.py notes "${GITHUB_REF_NAME}" > "${notes_file}"
          test -s "${notes_file}"

          echo "path=${notes_file}" >> "${GITHUB_OUTPUT}"

      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # A full workflow retry may follow a successful Release and failed deploy.
          if draft=$(gh release view "${GITHUB_REF_NAME}" --json isDraft --jq '.isDraft'); then
            if [[ "$draft" != false ]]; then
              echo 'Existing release must be published before deploying.' >&2
              exit 1
            fi
            echo "Release already published: ${GITHUB_REF_NAME}"
            exit 0
          fi
          gh release create "${GITHUB_REF_NAME}" \
            --verify-tag \
            --title "${GITHUB_REF_NAME}" \
            --notes-file "${{ steps.notes.outputs.path }}"
